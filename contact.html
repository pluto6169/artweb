<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا - كلية الآداب</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header class="top-bar">
        <div class="container">
            <div class="logo">
                <img src="assets/images/33.png" alt="شعار">

                <h1>كلية الآداب - جامعة القاهرة</h1>
            </div>
            <div class="search-box">
                <input type="search" placeholder="البحث في كافة البيانات">
            </div>
            <div class="user-info">
                <button class="login-btn">تسجيل الدخول</button>
            </div>
        </div>
    </header>

    <nav class="sidebar">
        <ul>
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="news.html">أخبار الكلية</a></li>
            <li><a href="events.html">الفعاليات والمؤتمرات</a></li>
            <li><a href="statistics.html">إحصائيات الكلية</a></li>
            <li><a href="research.html">النشاط العلمي</a></li>
            <li><a href="about.html">عن الكلية</a></li>
            <li><a href="departments.html">الأقسام العلمية</a></li>
            <li><a href="students.html">خدمات الطلاب</a></li>
            <li><a href="postgraduates.html">الدراسات العليا</a></li>
            <li><a href="admission.html">القبول والتسجيل</a></li>
            <li><a href="community.html">خدمة المجتمع</a></li>
            <li><a href="contact.html" class="active">اتصل بنا</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <section class="welcome-banner">
            <h2>اتصل بنا</h2>
            <p>نسعد بتواصلكم معنا</p>
        </section>

        <section class="departments-section">
            <form id="contactForm" onsubmit="validateContact(event)">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">الاسم:</label>
                    <input type="text" id="name" required
                        style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Cairo', sans-serif;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">البريد الإلكتروني:</label>
                    <input type="email" id="email" required
                        style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Cairo', sans-serif;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">الرسالة:</label>
                    <textarea id="message" required rows="5"
                        style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Cairo', sans-serif;"></textarea>
                </div>

                <button type="submit" class="read-more-btn">إرسال</button>
            </form>
        </section>
    </main>

    <script src="js/validate-contact.js"></script>
    <script src="js/user-management.js"></script>
    <script src="./assets/js/header-loader.js"></script>

</body>

</html>
