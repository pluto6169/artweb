<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القبول والتسجيل - كلية الآداب</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <header class="top-bar">
        <div class="container">
            <div class="logo">
                <img src="assets/images/33.png" alt="شعار">

                <h1>كلية الآداب - جامعة القاهرة</h1>
            </div>
            <div class="search-box">
                <input type="search" placeholder="البحث في كافة البيانات">
            </div>
            <div class="user-info">
                <button class="login-btn">تسجيل الدخول</button>
            </div>
        </div>
    </header>

    <nav class="sidebar">
        <ul>
            <li><a href="index.html">الرئيسية</a></li>
            <li><a href="news.html">أخبار الكلية</a></li>
            <li><a href="events.html">الفعاليات والمؤتمرات</a></li>
            <li><a href="statistics.html">إحصائيات الكلية</a></li>
            <li><a href="research.html">النشاط العلمي</a></li>
            <li><a href="about.html">عن الكلية</a></li>
            <li><a href="departments.html">الأقسام العلمية</a></li>
            <li><a href="students.html">خدمات الطلاب</a></li>
            <li><a href="postgraduates.html">الدراسات العليا</a></li>
            <li><a href="admission.html" class="active">القبول والتسجيل</a></li>
            <li><a href="community.html">خدمة المجتمع</a></li>
            <li><a href="contact.html">اتصل بنا</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <section class="welcome-banner">
            <h2>القبول والتسجيل</h2>
            <p>نموذج التقديم للطلاب الجدد</p>
        </section>

        <section class="departments-section">
            <form id="admissionForm" onsubmit="validateAdmission(event)">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">الاسم الكامل:</label>
                    <input type="text" id="fullName" required
                        style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Cairo', sans-serif;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">رقم الهاتف:</label>
                    <input type="tel" id="phone" required pattern="[0-9]{11}"
                        style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Cairo', sans-serif;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">البريد الإلكتروني:</label>
                    <input type="email" id="studentEmail" required
                        style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Cairo', sans-serif;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 5px; font-weight: 600;">القسم المراد الالتحاق
                        به:</label>
                    <select id="department" required
                        style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-family: 'Cairo', sans-serif;">
                        <option value="">اختر القسم</option>
                        <option value="arabic">اللغة العربية</option>
                        <option value="history">التاريخ</option>
                        <option value="geography">الجغرافيا</option>
                        <option value="sociology">علم الاجتماع</option>
                    </select>
                </div>

                <button type="submit" class="read-more-btn">تقديم الطلب</button>
            </form>
        </section>
    </main>

    <script src="js/validate-admission.js"></script>
    <script src="js/user-management.js"></script>
    <script src="./assets/js/header-loader.js"></script>

</body>

</html>
